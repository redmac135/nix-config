name: Build NixOS configurations

on:
  pull_request:
  push:
    branches:
      - dev

# Each push gets its own group, including queued pushes. Only older runs for
# the same PR may be canceled by a newer run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  updater-fixtures:
    name: updater-fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test updater fixtures
        run: |
          ./tests/update-dependencies.sh

  build:
    name: build-${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: pancakewsl
            runner: ubuntu-24.04
          - configuration: onhandwsl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Build ${{ matrix.configuration }} system closure
        env:
          FIRSTMATE_NIX_TOKEN: ${{ secrets.FIRSTMATE_NIX_TOKEN }}
        run: |
          source scripts/firstmate-nix-ci-auth
          nix build -L --no-link '.#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel'
      - name: Test host configuration
        env:
          FIRSTMATE_NIX_TOKEN: ${{ secrets.FIRSTMATE_NIX_TOKEN }}
        run: |
          source scripts/firstmate-nix-ci-auth
          nix eval --impure --expr 'import ./tests/firstmate-tools.nix { flake = builtins.getFlake (toString ./.); }' --apply 'x: assert x; x'
          ./tests/agent-instructions.sh "${{ matrix.configuration }}"
          ./tests/agent-extensions.sh "${{ matrix.configuration }}"
          ./tests/mise-install.sh "${{ matrix.configuration }}"
          ./tests/nvim-open.sh "${{ matrix.configuration }}"
