name: Validate NixOS configurations

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [surface, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate ${{ matrix.configuration }} system closure
        run: nix eval ".#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel.drvPath"

  build:
    name: build-${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: desktop
            runner: ubuntu-latest
          - configuration: surface
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build ${{ matrix.configuration }} system closure
        run: nix build -L --no-link '.#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel'
