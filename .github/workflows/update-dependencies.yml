name: Update firstmate tools and flake inputs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 10:30 UTC is 5:30 AM EST.
    - cron: "30 10 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update firstmate tools and flake inputs
        run: ./scripts/update-firstmate-tools-and-flake

      - name: Summarize version changes
        id: summary
        run: python3 scripts/firstmate-update-summary.py HEAD "$RUNNER_TEMP/update-pr-body.md" >> "$GITHUB_OUTPUT"

      - name: Open or update dependency PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: automation/update-firstmate-tools
          delete-branch: true
          commit-message: "chore: update firstmate tools and flake inputs"
          title: "chore: update firstmate tools and flake inputs"
          body-path: ${{ steps.summary.outputs.body_path }}
