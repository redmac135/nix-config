name: Update npm packages, no-mistakes, and flake inputs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Monday at 10:30 UTC is 5:30 AM EST.
    - cron: "30 10 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update npm packages, no-mistakes, and flake inputs
        run: ./scripts/update-npm-packages-and-flake

      - name: Summarize version changes
        id: summary
        run: python3 scripts/update-summary.py HEAD "$RUNNER_TEMP/update-pr-body.md" >> "$GITHUB_OUTPUT"

      - name: Open or update dependency PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: automation/update-npm-packages
          delete-branch: true
          commit-message: "chore: update pinned dependencies"
          title: "chore: update pinned dependencies"
          body-path: ${{ steps.summary.outputs.body_path }}
